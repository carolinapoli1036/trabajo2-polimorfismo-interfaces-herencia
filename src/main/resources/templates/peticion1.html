<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Peticion 1 - Nombres de Habitaciones</title>

        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f4; }
        h1 { color: #333; }

</html>
